name: fl_pokedex
description: "琥珀图鉴 — 完全离线的宝可梦图鉴。"
publish_to: 'none'

version: 1.0.0+1

environment:
  # docs/architecture.md §1 锁定范围
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.28.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

# 应用图标生成：dart run flutter_launcher_icons（源文件 assets/icon/，均为本项目原创）
flutter_launcher_icons:
  image_path: "assets/icon/app_icon_1024.png"
  adaptive_icon_background: "#262115"
  adaptive_icon_foreground: "assets/icon/app_icon_fg_1024.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/database/
    - assets/pokemon/full/
    - assets/pokemon/thumb/
