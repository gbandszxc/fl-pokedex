name: fl_pokedex
description: "Fl-PokeDex — 完全离线的宝可梦图鉴。"
publish_to: 'none'

version: 1.1.0+2

environment:
  # docs/architecture.md §1 锁定范围
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.0
  drift: ^2.28.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  collection: ^1.19.0
  # 本地 TTS 朗读（平台引擎：Android SpeechTts / Windows SAPI / Apple AVSpeech），
  # 纯 MethodChannel 无 HTTP 依赖，满足运行时 0 网络红线。
  flutter_tts: ^4.2.5
  # 关于/开源许可页的版本号：读安装包原生配置（Android versionName / Windows
  # 版本资源 / Apple CFBundleShortVersionString），纯 MethodChannel 无 HTTP
  # 依赖，比手写常量构造上不可能与 pubspec 漂移。
  package_info_plus: ^10.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.28.0
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  flutter_launcher_icons: ^0.14.4

# 应用图标生成：dart run flutter_launcher_icons（源文件 assets/icon/，均为本项目原创）
flutter_launcher_icons:
  image_path: "assets/icon/app_icon_1024.png"
  android: true
  adaptive_icon_background: "#024971"
  adaptive_icon_foreground: "assets/icon/app_icon_fg_1024.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    icon_size: 256
  macos:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/database/
    - assets/pokemon/full/
    - assets/pokemon/thumb/

  # 内嵌 MiSans（DESIGN.md §4）：项目仅用 w400/500/600。MiSans 全族 OS/2 权重为
  # 非标准刻度，槽位映射依据官方 CSS 惯例（400=Regular / 500=Medium / 600=Demibold）；
  # 同槽位旧版 cut Semibold 不嵌入。
  fonts:
    - family: MiSans
      fonts:
        - asset: assets/fonts/MiSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MiSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MiSans-Demibold.ttf
          weight: 600
