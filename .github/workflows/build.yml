name: build

# 手动触发；publish=true 时构建完成后发布 Release：
# 标签 v<版本号>，标题 <版本号>（取自 pubspec.yaml），正文为空，附件含 APK 与 MSI。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布 Release（标题为版本号，正文为空）'
        type: boolean
        default: false

permissions:
  contents: write # 发布 Release 与上传附件所需

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Set up JDK 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up uv (数据管线与 MSI 脚本)
        uses: astral-sh/setup-uv@v5

      - name: Cache 上游数据与 WiX（key 随 config.py 变化）
        uses: actions/cache@v4
        with:
          path: |
            tools/data_builder/.cache
            tools/msi/.cache
          key: upstream-${{ hashFiles('tools/data_builder/config.py') }}

      - name: 解析版本号
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version: *\([0-9A-Za-z.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: 构建离线数据（fetch → db → images → verify）
        run: uv run tools/data_builder/build_all.py
        env:
          PYTHONUTF8: '1'

      - run: flutter pub get

      - name: 构建 Android APK（release）
        run: flutter build apk --release

      - name: 构建 Windows（release）
        run: flutter build windows --release

      - name: 打包 MSI
        run: uv run tools/msi/build_msi.py
        env:
          PYTHONUTF8: '1'

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Fl-PokeDex-${{ steps.version.outputs.version }}
          path: |
            build/app/outputs/apk/release/Fl-PokeDex-*.apk
            build/windows/msi/Fl-PokeDex-*.msi
          if-no-files-found: error

      - name: 发布 Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          gh release create "v${VERSION}" \
            --title "${VERSION}" \
            --notes "" \
            "build/app/outputs/apk/release/Fl-PokeDex-${VERSION}-release.apk" \
            "build/windows/msi/Fl-PokeDex-${VERSION}-x64.msi"
