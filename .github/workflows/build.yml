name: build

# 手动触发；Android 与 Windows 两个平台 job 并行构建，publish=true 时
# 由 release job 汇合产物后发布 Release：标签 v<版本号>，标题 <版本号>（取自
# pubspec.yaml），正文为空，附件含 arm64-v8a / armeabi-v7a / x86_64 三个签名 APK 与 MSI。
# Release 签名：仓库 Settings → Secrets and variables → Actions 配置
#   ANDROID_KEYSTORE_BASE64（keystore 文件 base64）、ANDROID_KEYSTORE_PASSWORD、
#   ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD；未配置时回退 debug 签名产出。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: '构建后发布 Release（标题为版本号，正文为空）'
        type: boolean
        default: false

permissions:
  contents: write # 发布 Release 与上传附件所需

jobs:
  build-android:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      # cache: gradle 复用 ~/.gradle/caches 与 wrapper 分发，免每次冷拉 AGP/Kotlin/依赖
      - name: Set up JDK 21 (Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up uv (数据管线脚本)
        uses: astral-sh/setup-uv@v5

      - name: Cache 上游数据（key 随 config.py 变化）
        uses: actions/cache@v4
        with:
          path: tools/data_builder/.cache
          key: upstream-${{ hashFiles('tools/data_builder/config.py') }}

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          echo "version=$(sed -n 's/^version: *\([0-9A-Za-z.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: 构建离线数据（fetch → db → images → verify）
        run: uv run tools/data_builder/build_all.py
        env:
          PYTHONUTF8: '1'

      - run: flutter pub get

      - name: 配置 Release 签名（可选，未配置 Secrets 时回退 debug 签名）
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置签名 Secrets，回退 debug 签名产出。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # Java properties 中反斜杠是转义符，Windows 路径统一转成正斜杠
          STORE_PATH="$(cygpath -m "$RUNNER_TEMP")/release.keystore"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=$STORE_PATH"
          } > android/key.properties

      - name: 构建 Android APK（release，arm64-v8a / armeabi-v7a / x86_64 分包）
        run: flutter build apk --release --split-per-abi

      # Gradle daemon 存活到 job 结束会锁住 ~/.gradle/caches 的 .lock 文件，
      # 导致 setup-java post 阶段打包缓存失败（tar exit 2）；构建后立即停 daemon 释放锁
      - name: 停止 Gradle daemon（释放缓存锁文件）
        working-directory: android
        run: ./gradlew --stop

      - name: 上传构建产物（APK 三包）
        uses: actions/upload-artifact@v4
        with:
          name: Fl-PokeDex-apk-${{ steps.version.outputs.version }}
          path: build/app/outputs/apk/release/Fl-PokeDex-*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter 3.47.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
          cache: true

      - name: Set up uv (数据管线与 MSI 脚本)
        uses: astral-sh/setup-uv@v5

      - name: Cache 上游数据与 WiX（key 随 config.py 变化）
        uses: actions/cache@v4
        with:
          path: |
            tools/data_builder/.cache
            tools/msi/.cache
          key: upstream-${{ hashFiles('tools/data_builder/config.py') }}

      - name: 解析版本号
        id: version
        shell: bash
        run: |
          echo "version=$(sed -n 's/^version: *\([0-9A-Za-z.]*\).*/\1/p' pubspec.yaml)" >> "$GITHUB_OUTPUT"

      - name: 构建离线数据（fetch → db → images → verify）
        run: uv run tools/data_builder/build_all.py
        env:
          PYTHONUTF8: '1'

      - run: flutter pub get

      - name: 构建 Windows（release）
        run: flutter build windows --release

      - name: 打包 MSI
        run: uv run tools/msi/build_msi.py
        env:
          PYTHONUTF8: '1'

      - name: 上传构建产物（MSI）
        uses: actions/upload-artifact@v4
        with:
          name: Fl-PokeDex-msi-${{ steps.version.outputs.version }}
          path: build/windows/msi/Fl-PokeDex-*.msi
          if-no-files-found: error

  release:
    if: ${{ inputs.publish }}
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: Fl-PokeDex-*
          merge-multiple: true
          path: dist

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 不 checkout 仓库，gh 无法经 git 推断远端，需显式指定仓库
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build-android.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "${VERSION}" \
            --notes "" \
            "dist/Fl-PokeDex-${VERSION}-arm64-v8a-release.apk" \
            "dist/Fl-PokeDex-${VERSION}-armeabi-v7a-release.apk" \
            "dist/Fl-PokeDex-${VERSION}-x86_64-release.apk" \
            "dist/Fl-PokeDex-${VERSION}-x64.msi"
